name: GitHub Classroom Workflow
on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: docker compose build --push

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Create local Kubernetes cluster (Kind)
        uses: helm/kind-action@v1.10.0

      - name: Deploy Postgres
        run: |
          kubectl create namespace rsoi --dry-run=client -o yaml | kubectl apply -f -
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm upgrade --install postgres bitnami/postgresql -n rsoi --create-namespace -f helm/values/postgres.yaml

      - name: Wait for Postgres
        run: |
          kubectl wait -n rsoi --for=condition=Ready pod -l app.kubernetes.io/name=postgresql --timeout=180s

      - name: Init Postgres databases
        run: |
          POSTGRES_PASSWORD=$(kubectl get secret -n rsoi postgres-postgresql -o jsonpath="{.data.postgres-password}" | base64 -d)
          for database in reservations libraries ratings; do
            kubectl run "postgres-schema-grants-$database" --rm --attach --restart=Never \
              --namespace rsoi \
              --image=registry-1.docker.io/bitnami/postgresql:latest \
              --env="PGPASSWORD=$POSTGRES_PASSWORD" \
              --command -- psql --host postgres-postgresql -U postgres -d "$database" \
                -c "GRANT ALL ON SCHEMA public TO program;"
          done

      - name: Deploy services
        run: |
          for svc in rating library reservation gateway; do
            helm upgrade --install $svc helm/generic-service \
              -f helm/values/$svc.yaml \
              -n rsoi
          done

      - name: Wait for gateway
        run: |
          kubectl wait -n rsoi -l app.kubernetes.io/name=gateway \
            pod --for=condition=Ready --timeout=5m

      - name: Forward gateway for integration tests
        run: |
          kubectl port-forward --address 127.0.0.1 service/gateway 8080:80 -n rsoi > /tmp/gateway-port-forward.log 2>&1 &
          echo $! > /tmp/gateway-port-forward.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/gateway-port-forward.log
          exit 1

      - name: Install Newman
        run: npm install -g newman

      - name: Autograding
        uses: education/autograding@v1
