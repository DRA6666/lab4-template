services:
  postgres:
    image: library/postgres:13
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "${LAB4_POSTGRES_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  rating:
    build:
      context: ./rating
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        all_proxy: ""
    image: ghcr.io/dra6666/lab4-rating:latest
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ratings
      SPRING_DATASOURCE_USERNAME: program
      SPRING_DATASOURCE_PASSWORD: test
    ports:
      - "${LAB4_RATING_PORT:-28050}:8050"

  library:
    build:
      context: ./library
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        all_proxy: ""
    image: ghcr.io/dra6666/lab4-library:latest
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/libraries
      SPRING_DATASOURCE_USERNAME: program
      SPRING_DATASOURCE_PASSWORD: test
    ports:
      - "${LAB4_LIBRARY_PORT:-28060}:8060"

  reservation:
    build:
      context: ./reservation
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        all_proxy: ""
    image: ghcr.io/dra6666/lab4-reservation:latest
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservations
      SPRING_DATASOURCE_USERNAME: program
      SPRING_DATASOURCE_PASSWORD: test
    ports:
      - "${LAB4_RESERVATION_PORT:-28070}:8070"

  gateway:
    build:
      context: ./gateway
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        all_proxy: ""
    image: ghcr.io/dra6666/lab4-gateway:latest
    restart: on-failure
    depends_on:
      - rating
      - library
      - reservation
    environment:
      RATING_URL: http://rating:8050
      LIBRARY_URL: http://library:8060
      RESERVATION_URL: http://reservation:8070
    ports:
      - "${LAB4_GATEWAY_PORT:-28080}:8080"

volumes:
  db-data:
